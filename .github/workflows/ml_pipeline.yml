name: Run DVC + Push to DagsHub

on:
  push:
    branches: [ main ]  # ✅ Trigger only on main

jobs:
  run-dvc-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]" dagshub mlflow scikit-learn xgboost

      - name: 🔐 Authenticate DVC Remote
        run: |
          dvc remote modify dagshub auth basic
          dvc remote modify dagshub user "jeevitharamsudha16"
          dvc remote modify dagshub password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: ⚙️ Run DVC Pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc pull              # ✅ Pull from DagsHub first
          dvc repro             # ✅ Run the pipeline (main.py -> train/eval)

      - name: ☁️ Push Artifacts to DagsHub
        run: |
          dvc push              # ✅ Push updated models, metrics, etc.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dvc.lock
          git commit -m "🤖 Update dvc.lock after pipeline run" || echo "No changes to commit"
          git push
