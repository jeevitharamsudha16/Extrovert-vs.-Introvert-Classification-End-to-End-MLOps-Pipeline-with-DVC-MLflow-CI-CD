name: Run DVC + Push to DagsHub

on:
  push:
    branches: [ main ]  # ✅ Trigger only on pushes to main branch

jobs:
  run-dvc-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]" dagshub mlflow scikit-learn xgboost

      - name: 🔐 Configure DVC Remote (DagsHub)
        run: |
          dvc remote modify dagshub auth basic
          dvc remote modify dagshub user "jeevitharamsudha16"
          dvc remote modify dagshub password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: 🧲 Pull Data & Artifacts from DagsHub
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: dvc pull

      - name: ⚙️ Run DVC Pipeline (MLflow to DagsHub)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: jeevitharamsudha16
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: dvc repro

      - name: ☁️ Push Artifacts & Metrics to DagsHub
        run: dvc push

      - name: 🔁 Auto Commit & Push Updated DVC Lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add dvc.lock
          git diff --cached --quiet || git commit -m "🤖 Update dvc.lock after pipeline run"
          git push origin HEAD
